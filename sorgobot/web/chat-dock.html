<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StreamerMod Chat</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;font:14px system-ui;background:#161923;color:#e5e9f3}body{margin:0;display:flex;flex-direction:column;height:100vh}button,input,select{font:inherit;background:#262c3c;color:inherit;border:1px solid #596580;border-radius:4px;padding:6px}button{cursor:pointer}header,footer,#global{display:flex;gap:6px;padding:8px;flex-wrap:wrap}h1{font-size:16px;margin:0;flex:1}#rows{flex:1;overflow:auto;padding:0 10px}article{border-bottom:1px solid #343b50;padding:6px 0;overflow-wrap:anywhere}strong{color:#b9c9ff}small{opacity:.7}form{display:flex;gap:6px;width:100%}#message{flex:1;min-width:50px}#status{padding:0 8px;min-height:20px;color:#ffca8a}details{padding:6px}label{margin-right:10px}img{height:26px;vertical-align:middle}.tools{display:inline-flex;gap:4px;margin-left:8px;font-size:11px}.tools button{padding:2px 5px}
</style><body><header><h1 id="title">StreamerMod Chat</h1><button id="sync">Einstellungen übernehmen</button></header>
<details><summary>Dock-Einstellungen</summary><label>Schrift <input id="font" type="number" min="8" max="36" style="width:55px"></label><label>Zeilen <input id="limit" type="number" min="20" max="1000" style="width:70px"></label><label><input id="emotes" type="checkbox"> Emotes</label></details>
<div id="global"></div><main id="rows" aria-live="polite"></main><div id="status" role="status"></div><footer><form><select id="platform" aria-label="Sendeziel"><option value="twitch">Twitch</option><option value="youtube">YouTube</option><option value="both">Twitch + YouTube</option></select><select id="account" title="Twitch-Konto; YouTube sendet als angemeldeter Kanal"><option value="true">Bot</option><option value="false">Broadcaster</option></select><input id="message" autocomplete="off" placeholder="Nachricht oder /Befehl" list="commands"><datalist id="commands"></datalist><button id="send">Senden</button></form></footer>
<script src="/static/chat-dock.js"></script></body></html>
